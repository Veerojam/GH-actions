name: Reusable Deploy
on: 
  workflow_call: #allows this workflow to be called from other workflows
    inputs:
      artifact-name:
        description: The name of the deployable artifact files
        required: false
        default: dist
        type: string #must be provided
    outputs:
      result:
        description: The result of the deployment operation
        value: $${{ jobs.deploy.outputs.outcome }}
    secrets: #you can also include secrets in reusable workflows
      some-secret:
        required: true
jobs:
  deploy:
    outputs:
      outcome: $${{ steps.set-result.outputs.step-result }} #'outcome' is simply the name of the step
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
      - name: list files
        run: ls
      - name: Output information
        run: echo "Deploying & uploading..."
      - name: Set result output
        id: set-result
        run: echo "step-result=success" >> $GITHUB-OUTPUT #step-result=success is a key-value pair that shuld be stored